name: Frontend

on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Run codegen
        run: vp run codegen
      - name: Lint and type check
        run: vp check
      - name: Run tests
        run: vp test
      - name: Build
        run: vp build
