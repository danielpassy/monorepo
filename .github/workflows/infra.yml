name: Infra

on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Run infra checks
        run: ./.github/scripts/run-infra.sh
